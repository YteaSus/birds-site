    <h2>Галерея птиц</h2>
    <p>На этой странице — фотографии разных птиц с описаниями.</p>

    <div class="gallery">

        <figure class="card">
            <img src="img/bird1.jpg" alt="Зяблик" width="300">
            <figcaption>
                <strong>Зяблик</strong><br>
                <em>Fringilla coelebs</em><br>
                <span class="green-small">Певчая птица семейства вьюрковых. Длина тела — около 15 см. Обитает в лесах и парках Европы и Азии.</span>
            </figcaption>
        </figure>

        <figure class="card">
            <img src="img/bird2.jpg" alt="Вальдшнеп" width="300">
            <figcaption>
                <strong>Вальдшнеп</strong><br>
                <em>Scolopax rusticola</em><br>
                <span class="green-small">Лесной кулик семейства бекасовых. Длина тела — 33–38 см. Ведёт скрытный ночной образ жизни, обитает в сырых лесах.</span>
            </figcaption>
        </figure>

        <figure class="card">
            <img src="img/bird3.jpg" alt="Козодой" width="300">
            <figcaption>
                <strong>Козодой</strong><br>
                <em>Caprimulgus europaeus</em><br>
                <span class="green-small">Ночная птица отряда козодоеобразных. Длина тела — около 26 см. Известен громким «мурлыкающим» пением по ночам.</span>
            </figcaption>
        </figure>

    </div>

    <p class="green-small">Все фотографии взяты из открытых источников.</p>
